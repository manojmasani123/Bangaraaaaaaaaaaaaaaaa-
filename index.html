<!DOCTYPE html>
<html>
<head>
  <title>For Pavani ❤️</title>
  <style>
    body {
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      z-index: 2;
      position: relative;
    }

    h1 { font-size: 28px; }
    p { font-size: 18px; }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #ff4b7d;
      cursor: pointer;
    }

    /* ❤️ Heart Animation */
    .heart {
      position: absolute;
      bottom: -20px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="box" id="content">
    <h1>Hey Pavani ❤️</h1>
    <p>I have something special to ask you…</p>
    <p><b>Pavani, will you be mine forever? 💍🥰</b></p>
    <button onclick="yesClicked()">YES 😍</button>
    <button onclick="noClicked()">NO 🙈</button>
  </div>

  <script>
    function noClicked() {
      document.getElementById("content").innerHTML = `
        <h1>Pavani 🥺❤️</h1>
        <p><b>Please love me bangaraaaa 💕🥹</b></p>
        <button onclick="yesClicked()">YES 😍</button>
        <button onclick="noClicked()">NO 🙈</button>
      `;
    }

    function yesClicked() {
      document.getElementById("content").innerHTML = `
        <h1>Yayyyyy 😍🌹</h1>
        <p><b>I love you pavvvv 🌹🤌🏻❤️</b></p>
      `;
    }

    // Generate floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }, 400);
  </script>

</body>
</html>
